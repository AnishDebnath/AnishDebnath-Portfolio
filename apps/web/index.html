    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Person",
        "@id": "https://anishdebnath.site/#person",
        "name": "Anish Debnath",
        "url": "https://anishdebnath.site/",
        "image": "https://anishdebnath.site/og-image.png",
        "jobTitle": "Product Designer & UI/UX Developer",
        "description": "I design and build digital products that are intuitive to use, technically reliable, and built around real user and business needs.",
        "knowsAbout": [
          "Product Design",
          "UI/UX Design",
          "Frontend Development",
          "Web Development",
          "Digital Product Development"
        ],
        "sameAs": [
          "https://www.linkedin.com/in/anish-debnath",
          "https://github.com/AnishDebnath",
          "https://x.com/anishdebnath07"
        ]
      },
      {
        "@type": "WebSite",
        "@id": "https://anishdebnath.site/#website",
        "url": "https://anishdebnath.site/",
        "name": "Anish Debnath — Portfolio",
        "description": "Personal portfolio of Anish Debnath, Product Designer & UI/UX Developer building digital products.",
        "publisher": { "@id": "https://anishdebnath.site/#person" },
        "inLanguage": "en"
      },
      {
        "@type": "ProfilePage",
        "@id": "https://anishdebnath.site/#profilepage",
        "url": "https://anishdebnath.site/",
        "name": "Anish Debnath — Product Designer & UI/UX Developer",
        "description": "Personal portfolio of Anish Debnath, Product Designer & UI/UX Developer.",

        "about": { "@id": "https://anishdebnath.site/#person" }
      }
    ]
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <script>
    (function () {
      try {
        var origFetch = window.fetch;
        var customFetch = origFetch;

          configurable: true,
          enumerable: true
        });

    })();
