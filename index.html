    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          var customFetch = origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return customFetch; },
            set: function(fn) { customFetch = fn; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}
      })();
    </script>
